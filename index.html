<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City weather</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <link rel="stylesheet" href="./style/style.css" />
    <link rel="stylesheet" href="./style/media.css" />
    <link
      rel="shortcut icon"
      href="./img/openclipart-vectors-cold-1293305_640.png"
    />
  </head>

  <body>
    <div id="spinner"></div>

    <div id="main_container">
      <div class="search_wrapper">

        <form class="search">
          <input
            class="inp"
            type="text"
            placeholder="city name"
            title="enter your city"
          />
          <button class="btn">search</button>
        </form>

         <ul id="history" class="hidden"></ul>
      </div>

      <div id="error"></div>
      
      <div id="output_wrap" class="hidden">
        <div id="map" class="animate__animated animate__fadeInLeft"></div>
        <div class="output animate__animated animate__fadeInRight"></div>
      </div>
    </div>
    <script src="./script/script.js"></script>
  </body>
</html>
